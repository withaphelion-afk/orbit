name: deploy space

# Continuous deployment: once CI passes on main, put that commit on the Hugging
# Face Space (web terminal + API), and Hugging Face rebuilds it. The first run
# also creates the Space (private, Docker). Every run sets the Space's secrets
# and variables from this repo's, so they are only ever entered here:
#   secrets   HF_TOKEN (Hugging Face, write), ORBIT_DATA_TOKEN, ORBIT_DISPATCH_TOKEN
#   variables ORBIT_DATA_REPO, HF_SPACE (optional, default <hf-user>/orbit)
# Does nothing until HF_TOKEN is set. Run it by hand to redeploy the current main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only a green CI run of a push to main (not a PR run that happens to target main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Create or update the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          ORBIT_DATA_TOKEN: ${{ secrets.ORBIT_DATA_TOKEN }}
          ORBIT_DISPATCH_TOKEN: ${{ secrets.ORBIT_DISPATCH_TOKEN }}
          ORBIT_DATA_REPO: ${{ vars.ORBIT_DATA_REPO }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: uv run --no-project --with huggingface_hub python deploy/hf-space/deploy.py
