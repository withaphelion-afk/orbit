name: deploy space

# Continuous deployment of the web terminal: once CI passes on main, build the
# static terminal (VITE_ORBIT_STATIC=1) and publish it to the Hugging Face Space
# (free, static, private; created on first use). The terminal's data is published
# separately by the runner, analysis and decide jobs. Needs the HF_TOKEN secret
# (Hugging Face, write); HF_SPACE is optional (default <hf-user>/orbit). Does
# nothing until HF_TOKEN is set. Run it by hand to redeploy the current main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only a green CI run of a push to main (not a PR run that happens to target main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the static terminal
        working-directory: web
        env:
          VITE_ORBIT_STATIC: "1"
          VITE_ORBIT_GITHUB_REPO: ${{ github.repository }}
        run: npm ci --no-audit --no-fund && npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Publish it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: uv run --no-project --with huggingface_hub python deploy/hf-space/publish.py --web web/dist
