name: deploy web

# Continuous deployment of the web terminal: once CI passes on main, build the
# static terminal (VITE_ORBIT_STATIC=1) and deploy it to Vercel's production
# URL. The app holds no data: it reads the private data repo's `site` branch
# with the viewer's own GitHub token. Needs the VERCEL_TOKEN secret; does
# nothing until it is set. Run it by hand to redeploy the current main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only a green CI run of a push to main (not a PR run that happens to target main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the static terminal
        working-directory: web
        env:
          VITE_ORBIT_STATIC: "1"
          VITE_ORBIT_GITHUB_REPO: ${{ github.repository }}
          VITE_ORBIT_DATA_REPO: ${{ vars.ORBIT_DATA_REPO }}
        run: npm ci --no-audit --no-fund && npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set, so the terminal isn't deployed (README: Free cloud hosting)."
            exit 0
          fi
          # A plain static folder; the folder's name becomes the Vercel project's ("orbit").
          mkdir -p "$RUNNER_TEMP/orbit" && cp -r web/dist/. "$RUNNER_TEMP/orbit/"
          cd "$RUNNER_TEMP/orbit"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee "$RUNNER_TEMP/vercel.txt"
          echo "### Deployed: $(tail -1 "$RUNNER_TEMP/vercel.txt")" >> "$GITHUB_STEP_SUMMARY"
