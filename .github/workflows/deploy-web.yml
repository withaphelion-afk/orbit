name: deploy web

# Continuous deployment of the web terminal: once CI passes on main, build the
# static terminal (VITE_ORBIT_STATIC=1) and deploy it to Vercel's production
# URL. The app holds no data: it reads the private data repo's `site` branch
# with the viewer's own GitHub token. Needs the VERCEL_TOKEN secret; does
# nothing until it is set. Run it by hand to redeploy the current main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only a green CI run of a push to main (not a PR run that happens to target main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the static terminal
        working-directory: web
        env:
          VITE_ORBIT_STATIC: "1"
          VITE_ORBIT_GITHUB_REPO: ${{ github.repository }}
          VITE_ORBIT_DATA_REPO: ${{ vars.ORBIT_DATA_REPO }}
        run: npm ci --no-audit --no-fund && npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # For the site's login service (web/vercel/api), which reads the private data and starts workflows
          # with this token on the server; it never reaches the browser.
          ORBIT_GITHUB_TOKEN: ${{ secrets.ORBIT_DATA_TOKEN }}
          ORBIT_DATA_REPO: ${{ vars.ORBIT_DATA_REPO }}
          ORBIT_CODE_REPO: ${{ github.repository }}
          # One login for every device. Override with the ORBIT_LOGIN_USER variable / ORBIT_LOGIN_PASSWORD secret.
          ORBIT_LOGIN_USER: ${{ vars.ORBIT_LOGIN_USER || 'saksham' }}
          ORBIT_LOGIN_PASSWORD: ${{ secrets.ORBIT_LOGIN_PASSWORD || '00000000' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set, so the terminal isn't deployed (README: Free cloud hosting)."
            exit 0
          fi
          # The static terminal plus its login service (Vercel functions in api/); the folder's name is the project's ("orbit").
          mkdir -p "$RUNNER_TEMP/orbit" && cp -r web/dist/. "$RUNNER_TEMP/orbit/" && cp -r web/vercel/api "$RUNNER_TEMP/orbit/api"
          cd "$RUNNER_TEMP/orbit"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"             -e ORBIT_GITHUB_TOKEN="$ORBIT_GITHUB_TOKEN" -e ORBIT_DATA_REPO="$ORBIT_DATA_REPO" -e ORBIT_CODE_REPO="$ORBIT_CODE_REPO"             -e ORBIT_LOGIN_USER="$ORBIT_LOGIN_USER" -e ORBIT_LOGIN_PASSWORD="$ORBIT_LOGIN_PASSWORD" | tee "$RUNNER_TEMP/vercel.txt"
          echo "### Deployed: $(tail -1 "$RUNNER_TEMP/vercel.txt")" >> "$GITHUB_STEP_SUMMARY"
