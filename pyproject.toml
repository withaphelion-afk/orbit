[project]
name = "orbit"
version = "0.1.0"
description = "24/7 systematic trading assistant for BTC, ETH, SOL, and Silver"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "skyfield>=1.55",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13",
    "httpx2>=2.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]
